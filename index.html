<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN Seddur 1 - Cerdas & Berkarakter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #ffc107;
            --dark: #222;
            --light: #f8f9fa;
            --danger: #c0392b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; overflow-x: hidden; }

        /* Header Logo Section */
        .main-header {
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 5%; background: white; border-bottom: 2px solid var(--primary);
        }
        .logo-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container { display: flex; align-items: center; gap: 10px; width: 100%; }
        .logo-text h1 { font-size: 1.2rem; line-height: 1.2; }
        .logo-text p { font-size: 0.8rem; color: #555; }
        
        .logo-placeholder { 
            position: absolute; top: 0; left: 0; height: 100%; width: 100%; background: var(--primary); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; z-index: 1;
        }
        .logo-main { position: relative; height: 45px; width: 45px; object-fit: contain; display: block; z-index: 2; }

        /* Navigation & Responsive Hamburger Menu */
        nav { 
            background: rgba(46, 125, 50, 0.95); position: sticky; top: 0; 
            z-index: 9999; backdrop-filter: blur(5px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .menu-toggle {
            display: none; background: none; border: none; color: white; font-size: 24px; padding: 15px; cursor: pointer; width: 100%; text-align: left;
        }
        nav ul { list-style: none; display: flex; justify-content: center; margin: 0; padding: 0; flex-wrap: wrap; }
        nav ul li { position: relative; }
        nav ul li a { display: block; padding: 12px 15px; color: white; text-decoration: none; font-weight: bold; font-size: 13px; transition: 0.3s; }
        nav ul li a:hover { background: rgba(255,255,255,0.1); }

        .dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0; 
            background: white; min-width: 200px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            list-style: none; border-radius: 0 0 5px 5px; z-index: 1000;
        }
        nav ul li:hover .dropdown-menu { display: block; }
        .dropdown-menu li a { color: #333 !important; padding: 12px 15px; border-bottom: 1px solid #f0f0f0; }
        .dropdown-menu li a:hover { background: #f9f9f9; color: var(--primary) !important; }

        /* Hero Slider */
        .hero-slider {
            height: 70vh; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            text-align: center; color: white; background: #1b5e20;
        }
        .slides { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s ease-in-out;
            background-color: #1b5e20;
        }
        .slide.active { opacity: 1; }
        .hero-content { position: relative; z-index: 2; padding: 0 15px; }
        .hero-content h1 { font-size: 2rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); margin: 15px 0; }
        .hero-content p { font-size: 1rem; max-width: 800px; margin: 0 auto 20px; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }

        /* Sections & Containers */
        .container { padding: 40px 5%; }
        .section-title { text-align: center; margin-bottom: 30px; }
        .section-title h2 { color: var(--primary); font-size: 1.8rem; margin-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-bottom: 5px solid var(--primary);
            transition: 0.3s; text-align: center;
        }
        .card i { font-size: 2.2rem; color: var(--secondary); margin-bottom: 15px; }

        .guru-avatar {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover; 
            margin: 0 auto 15px; border: 3px solid #eee; background: #e0e0e0;
            display: flex; align-items: center; justify-content: center; font-size: 30px; color: #757575;
        }

        .galeri-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .galeri-img-box { width: 100%; height: 180px; overflow: hidden; background: #eee; }
        .galeri-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .galeri-info { padding: 15px; text-align: left; }
        .galeri-info h4 { color: #333; font-size: 15px; margin-bottom: 5px; }
        .galeri-info p { color: #777; font-size: 12px; }

        .btn { 
            background: var(--secondary); color: var(--dark); padding: 10px 25px; 
            border-radius: 30px; text-decoration: none; font-weight: bold; 
            border: none; cursor: pointer; transition: 0.3s; display: inline-block; font-size: 14px;
        }
        .btn:hover { background: #e0a800; }

        #sambutanSection, #guruSection, #galeriSection, #saranaSection, #ekstraSection { display: none; }

        footer { background: var(--dark); color: white; padding: 40px 5% 20px; text-align: center; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; text-align: left; margin-bottom: 20px; }
        .social-icons { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .social-icons a { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 18px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
        .security-notice { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; border-radius: 4px; font-size: 11px; color: #856404; margin-bottom: 15px; text-align: left; }

        /* Media Query Khusus HP (Mobile View Optimization) */
        @media screen and (max-width: 768px) {
            .main-header { padding: 10px 3%; }
            .logo-text h1 { font-size: 1rem; }
            .logo-text p { font-size: 0.7rem; }
            
            .menu-toggle { display: block; }
            nav ul { 
                display: none; 
                flex-direction: column; 
                width: 100%; 
                background: rgba(46, 125, 50, 0.98); 
            }
            nav ul.active { display: flex; }
            nav ul li { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); }
            nav ul li a { padding: 12px 20px; font-size: 14px; }
            
            .dropdown-menu { 
                position: static; 
                box-shadow: none; 
                background: rgba(0,0,0,0.1); 
                width: 100%; 
            }
            nav ul li:hover .dropdown-menu { display: none; } /* Ubah interaksi dropdown untuk HP menggunakan klik JS jika diperlukan, atau biarkan tampil */
            nav ul li.open .dropdown-menu { display: block; }

            .hero-slider { height: 60vh; }
            .hero-content h1 { font-size: 1.5rem; }
            .hero-content p { font-size: 0.9rem; }
            .container { padding: 30px 4%; }
            .section-title h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

   <header class="main-header">
        <div class="logo-container">
            <div class="logo-wrapper">
                <div class="logo-placeholder"><i class="fas fa-school"></i></div>
                <img src="galeri/logo-tut.jpg" alt="Logo Sekolah" class="logo-main">
            </div>
            
            <div class="logo-wrapper">
                <img src="galeri/logo-sekolah.jpg" alt="Logo Tambahan" class="logo-main">
            </div>

            <div class="logo-text">
                <h1>SDN SEDDUR 1</h1>
                <p>Kec. Pakong, Kab. Pamekasan</p>
            </div>
        </div>
    </header>

    <nav>
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i> Menu Utama</button>
        <ul id="navMenu">
            <li>
                <a href="#" style="background-color: #2e7d32;" onclick="toggleDropdown(event)">BERANDA ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="javascript:void(0)" onclick="bukaSambutan()">🎤 Sambutan Kepsek</a></li>
                    <li><a href="javascript:void(0)" onclick="bukaTenagaPendidik()">👩‍🏫 Tenaga Pendidik</a></li>
                    <li><a href="javascript:void(0)" onclick="munculInfo('sejarah')">📜 Sejarah Sekolah</a></li>
                </ul>
            </li>
            <li>
                <a href="#" style="background-color: #1976d2;" onclick="toggleDropdown(event)">PROFIL ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="javascript:void(0)" onclick="munculInfo('visi')">Visi & Misi</a></li>
                    <li><a href="javascript:void(0)" onclick="bukaSaranaPrasarana()">🏫 Sarana Prasarana</a></li>
                    <li><a href="javascript:void(0)" onclick="munculInfo('ekstra')">⚽ Ekstrakurikuler</a></li>
                </ul>
            </li>
            <li><a href="javascript:void(0)" onclick="bukaGaleri()" style="background-color: #7b1fa2;">📸 GALERI</a></li>
            <li><a href="#akademik" style="background-color: #f57c00;">AKADEMIK</a></li>
            <li><a href="#kontak" style="background-color: #00796b;">KONTAK</a></li>
            <li><a href="#pengaduan" style="background-color: #c0392b;">PENGADUAN</a></li>
		    <li><a href="https://www.datadikdasmen.com/search?q=Pembelajaran+Mendalam&m=1" target="_blank" style="background-color: #333366;">DATADIKDASMEN</a></li>
		</ul>
    </nav>

    <!-- (Bagian Konten Lainnya Tetap Seperti Semula, Hanya Penyesuaian Style CSS di Atas) -->

    <script>
        // Fungsi Tombol Menu Hamburger HP
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('active');
        }

        function toggleDropdown(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                const parentLi = e.target.parentElement;
                parentLi.classList.toggle('open');
            }
        }

        // Slider Logic
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            if(slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }
        setInterval(nextSlide, 4000);

        // UI Navigation Functions
        function bukaSambutan() {
            hideAllSections();
            document.getElementById("sambutanSection").style.display = "block";
            document.getElementById("sambutanSection").scrollIntoView({ behavior: 'smooth' });
        }
        function tutupSambutan() { document.getElementById("sambutanSection").style.display = "none"; }

        function bukaTenagaPendidik() {
            hideAllSections();
            document.getElementById("guruSection").style.display = "block";
            document.getElementById("guruSection").scrollIntoView({ behavior: 'smooth' });
        }
        function tutupGuru() { document.getElementById("guruSection").style.display = "none"; }

        function bukaGaleri() {
            hideAllSections();
            document.getElementById("galeriSection").style.display = "block";
            document.getElementById("galeriSection").scrollIntoView({ behavior: 'smooth' });
        }
        function tutupGaleri() { document.getElementById("galeriSection").style.display = "none"; }

        function bukaSaranaPrasarana() {
            hideAllSections();
            document.getElementById("saranaSection").style.display = "block";
            document.getElementById("saranaSection").scrollIntoView({ behavior: 'smooth' });
        }
        function tutupSaranaPrasarana() { document.getElementById("saranaSection").style.display = "none"; }

        function bukaEkstra() {
            hideAllSections();
            document.getElementById("ekstraSection").style.display = "block";
            document.getElementById("ekstraSection").scrollIntoView({ behavior: 'smooth' });
        }
        function tutupEkstra() { document.getElementById("ekstraSection").style.display = "none"; }

        function hideAllSections() {
            document.getElementById("sambutanSection").style.display = "none";
            document.getElementById("guruSection").style.display = "none";
            document.getElementById("galeriSection").style.display = "none";
            document.getElementById("saranaSection").style.display = "none";
            document.getElementById("ekstraSection").style.display = "none";
            document.getElementById("kotakInfo").style.display = "none";
        }

        function munculInfo(tipe) {
            const kotak = document.getElementById('kotakInfo');
            const judul = document.getElementById('judulInfo');
            const isi = document.getElementById('isiInfo');
            
            if (tipe === 'visi') {
                judul.innerText = "Visi & Misi";
                isi.innerHTML = "<b>Visi:</b><br>Mencetak Siswa Unggul Berprestasi, Berbudi Pekerti Luhur, Bertakwa dan Peduli Lingkungan.<br><br><b>Misi:</b><br>1. Melaksanakan pembelajaran efektif.<br>2. Menumbuhkan penghayatan agama.<br>3. Menerapkan manajemen peduli lingkungan.";
            } else if (tipe === 'sejarah') {
                judul.innerText = "Sejarah Sekolah";
                isi.innerHTML = "SDN Seddur 1 didirikan untuk memberikan akses pendidikan berkualitas di Desa Seddur.";
            } else if (tipe === 'kurikulum') {
                judul.innerText = "Kurikulum Merdeka";
                isi.innerHTML = "Menerapkan Kurikulum Merdeka yang fleksibel dan berfokus pada pengembangan karakter.";
            } else if (tipe === 'karakter') {
                judul.innerText = "Pendidikan Karakter";
                isi.innerHTML = "Pembiasaan sholat berjamaah, doa, dan budaya 5S.";
            } else if (tipe === 'ekstra') {
                bukaEkstra();
                return;
            }
            kotak.style.display = "flex";
        }

        function tutupInfo() { document.getElementById('kotakInfo').style.display = "none"; }
        function bukaModal() { document.getElementById("modalPPDB").style.display = "flex"; }
        function tutupModal() { document.getElementById("modalPPDB").style.display = "none"; }
    </script>
</body>
</html>
